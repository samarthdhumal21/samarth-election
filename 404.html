{% extends "base.html" %}

{% block head %}
<style>
.not-found-container {
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
}

.not-found-container i {
    font-size: 100px;
    color: var(--saffron);
    margin-bottom: 30px;
}

.not-found-container h1 {
    font-size: 120px;
    font-weight: 800;
    margin-bottom: 10px;
    line-height: 1;
    background: linear-gradient(90deg, var(--saffron), var(--navy));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.not-found-container h2 {
    font-size: 32px;
    margin-bottom: 20px;
}

.not-found-container p {
    font-size: 18px;
    color: var(--text-muted);
    margin-bottom: 40px;
    max-width: 500px;
}
</style>
{% endblock %}

{% block content %}
<div class="not-found-container">
    <i class="fa-solid fa-map-location-dot"></i>
    <h1>404</h1>
    <h2>This constituency doesn't exist!</h2>
    <p>It seems you've wandered out of your polling area. The page you are looking for has been disqualified or moved to another server.</p>
    <a href="/" class="btn-primary">Return to Home Constituency</a>
</div>
{% endblock %}
