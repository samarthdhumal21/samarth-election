{% extends "base.html" %}

{% block head %}
<style>
.glossary-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
    flex-wrap: wrap;
    gap: 20px;
}

.search-bar {
    position: relative;
    width: 100%;
    max-width: 400px;
}

.search-bar i {
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
}

.search-bar input {
    width: 100%;
    background: rgba(0,0,0,0.05);
    border: none;
    border-radius: 500px;
    padding: 12px 20px 12px 40px;
    color: var(--text-main);
    font-size: 14px;
    font-family: var(--font-family);
}

.search-bar input:focus {
    outline: 2px solid var(--text-main);
}

.filter-tags {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.filter-tag {
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-shadow);
    color: var(--text-muted);
    border: none;
    padding: 8px 16px;
    border-radius: 500px;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s ease;
}

.filter-tag:hover {
    background-color: rgba(0,0,0,0.1);
    color: var(--text-main);
}

.filter-tag.active {
    background-color: var(--text-main);
    color: var(--bg-color);
    font-weight: 700;
}

.glossary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
}

.glossary-card {
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-shadow);
    border-radius: 8px;
    padding: 20px;
    transition: transform 0.2s ease;
}

.glossary-card:hover {
    transform: translateY(-5px);
    background: rgba(0,0,0,0.05);
}

.term-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 10px;
}

.term-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--saffron);
}

.term-badge {
    font-size: 10px;
    text-transform: uppercase;
    background-color: rgba(255,255,255,0.1);
    padding: 4px 8px;
    border-radius: 4px;
    letter-spacing: 1px;
}

.term-def {
    font-size: 14px;
    color: var(--text-muted);
    line-height: 1.5;
}

.no-results {
    text-align: center;
    grid-column: 1 / -1;
    padding: 40px;
    color: var(--text-muted);
    font-size: 18px;
}
</style>
{% endblock %}

{% block content %}
<h1 class="section-title">Election Glossary</h1>

<div class="glossary-controls">
    <div class="search-bar">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Search for terms (e.g., EVM, Returning Officer)...">
    </div>
    
    <div class="filter-tags" id="filterTags">
        <button class="filter-tag active" data-filter="all">All</button>
        <button class="filter-tag" data-filter="Technology">Technology</button>
        <button class="filter-tag" data-filter="Officials">Officials</button>
        <button class="filter-tag" data-filter="Voting Process">Voting Process</button>
        <button class="filter-tag" data-filter="Legal Terms">Legal Terms</button>
    </div>
</div>

<div class="glossary-grid" id="glossaryGrid">
    <!-- Rendered by JS -->
</div>
{% endblock %}

{% block scripts %}
<script>
const glossaryData = [
    { title: "EVM", cat: "Technology", def: "Electronic Voting Machine used to record votes electronically. Manufactured by BEL and ECIL, powered by a 6V alkaline battery, usable without electricity." },
    { title: "Ballot Unit", cat: "Technology", def: "The part of the EVM placed inside the voting booth where the voter presses a button against the candidate's name and symbol to cast their vote." },
    { title: "Control Unit", cat: "Technology", def: "The part of the EVM kept with the Presiding Officer. Used to enable voting, store recorded votes, and display results after polling ends." },
    { title: "VVPAT", cat: "Technology", def: "Voter Verifiable Paper Audit Trail. Prints a paper slip showing the candidate's name and symbol for 7 seconds, then drops it into a sealed box for audit purposes." },
    { title: "M3 EVM", cat: "Technology", def: "The third-generation Electronic Voting Machine featuring advanced tamper-detection, self-diagnostics, and enhanced security. Deployed since the 2019 General Elections." },
    { title: "Mock Poll", cat: "Technology", def: "A test voting session conducted before actual polling begins, in the presence of party agents, to verify that the EVM is functioning correctly and has no pre-recorded votes." },
    { title: "Totalizer", cat: "Technology", def: "A device used to aggregate and count votes from multiple EVMs simultaneously, helping maintain booth-level secrecy during vote counting." },
    { title: "BEL", cat: "Technology", def: "Bharat Electronics Limited, headquartered in Bengaluru. One of the two government-authorized manufacturers of EVMs and VVPATs in India." },
    { title: "ECIL", cat: "Technology", def: "Electronic Corporation of India Limited, headquartered in Hyderabad. The second government-authorized manufacturer of EVMs and VVPATs in India." },
    
    { title: "Returning Officer (RO)", cat: "Officials", def: "The official appointed by ECI to oversee and conduct elections in a specific constituency. Responsible for accepting nominations, scrutiny, and declaring results." },
    { title: "Presiding Officer", cat: "Officials", def: "The officer in charge of a polling station. Controls the EVM, verifies voter identity, and ensures free and fair voting throughout the day." },
    { title: "Polling Officer", cat: "Officials", def: "Assists the Presiding Officer at a polling booth. Responsible for checking voter ID, marking the electoral roll, and applying indelible ink on the voter's finger." },
    { title: "Chief Electoral Officer (CEO)", cat: "Officials", def: "The senior IAS officer appointed at the state level to supervise and coordinate all election-related activities within that state under ECI's direction." },
    { title: "Election Observer", cat: "Officials", def: "An independent IAS or IPS officer deputed by ECI to monitor the conduct of elections in a constituency and report any malpractice or irregularity." },
    { title: "Micro Observer", cat: "Officials", def: "An officer posted at a specific sensitive polling booth to closely observe voting activity and report any violations to the Election Observer." },
    { title: "Booth Level Officer (BLO)", cat: "Officials", def: "A grassroots-level official responsible for maintaining and updating the electoral roll in a specific booth area by visiting households and verifying voter details." },
    { title: "District Election Officer (DEO)", cat: "Officials", def: "Usually the District Collector, this officer manages all election logistics within a district including EVM distribution, staff deployment, and law enforcement coordination." },
    
    { title: "Electoral Roll", cat: "Voting Process", def: "The official list of all eligible and registered voters in a constituency, maintained and updated by the Election Commission of India before every election." },
    { title: "Polling Booth", cat: "Voting Process", def: "The designated government-assigned location where registered voters go to cast their vote on polling day. Each booth typically covers around 1,000–1,500 voters." },
    { title: "Model Code of Conduct (MCC)", cat: "Voting Process", def: "A set of guidelines issued by ECI that political parties, candidates, and the government must follow from the date of election announcement until results are declared." },
    { title: "Nomination", cat: "Voting Process", def: "The formal process by which a candidate officially declares their intention to contest an election by submitting nomination papers to the Returning Officer." },
    { title: "Scrutiny", cat: "Voting Process", def: "The examination of nomination papers by the Returning Officer to verify eligibility, completeness, and legal validity of each candidate's filing." },
    { title: "Counting Day", cat: "Voting Process", def: "The officially designated day on which votes recorded in EVMs are tallied and results are declared. Conducted at a counting centre under strict security." },
    { title: "Booth Capturing", cat: "Voting Process", def: "An illegal act where individuals forcibly take over a polling booth to fraudulently cast votes. It is a punishable criminal offence under Indian election law." },
    { title: "Postal Ballot", cat: "Voting Process", def: "A facility that allows certain voters — including armed forces personnel, senior citizens, and persons with disabilities — to cast their vote by mail without visiting a booth." },
    { title: "Tendered Vote", cat: "Voting Process", def: "A vote cast by a legitimate voter who finds that their vote has already been fraudulently cast by someone else. Recorded separately and counted only in case of disputes." },
    { title: "Silent Zone", cat: "Voting Process", def: "A 100-metre radius area around every polling booth where political campaigning, loudspeakers, and canvassing are strictly prohibited on polling day." },
    
    { title: "Representation of the People Act, 1951", cat: "Legal Terms", def: "The primary legislation governing elections in India. It defines rules for conduct of elections, qualifications of candidates, election offences, and dispute resolution." },
    { title: "Delimitation", cat: "Legal Terms", def: "The process of redrawing the boundaries of parliamentary and assembly constituencies based on updated census data, carried out by the Delimitation Commission." },
    { title: "Affidavit", cat: "Legal Terms", def: "A sworn legal document filed by every candidate declaring their criminal record, educational qualifications, and financial assets and liabilities before contesting an election." },
    { title: "Election Petition", cat: "Legal Terms", def: "A legal challenge filed in the High Court by a losing candidate or voter disputing the validity of an election result on grounds of malpractice or violation of election law." },
    { title: "Disqualification", cat: "Legal Terms", def: "The legal process by which a candidate or sitting legislator is barred from contesting or holding office due to criminal conviction, defection, or other legal grounds." },
    { title: "Anti-Defection Law", cat: "Legal Terms", def: "Enshrined in the 10th Schedule of the Indian Constitution, this law disqualifies any legislator who votes against their party's direction or voluntarily gives up party membership." },
    { title: "No Confidence Motion", cat: "Legal Terms", def: "A motion moved in the legislature to test whether the ruling government still holds the majority's support. If passed, the government must resign." },
    { title: "Election Commission of India (ECI)", cat: "Legal Terms", def: "An independent constitutional body established under Article 324, responsible for supervising, directing, and controlling the conduct of all elections in India." },
    { title: "Election Schedule", cat: "Legal Terms", def: "The formal announcement made by ECI that sets the dates for polling, nomination, scrutiny, and counting. Its release immediately triggers the Model Code of Conduct." },
    { title: "NOTA", cat: "Legal Terms", def: "None of the Above. An option introduced in 2013 by the Supreme Court directive, allowing voters to officially reject all candidates contesting from their constituency." }
];

const grid = document.getElementById('glossaryGrid');
const searchInput = document.getElementById('searchInput');
const filterTags = document.querySelectorAll('.filter-tag');

let currentFilter = 'all';
let currentSearch = '';

function renderGlossary() {
    grid.innerHTML = '';
    
    const filtered = glossaryData.filter(item => {
        const matchesFilter = currentFilter === 'all' || item.cat === currentFilter;
        const matchesSearch = item.title.toLowerCase().includes(currentSearch.toLowerCase()) || 
                              item.def.toLowerCase().includes(currentSearch.toLowerCase());
        return matchesFilter && matchesSearch;
    });
    
    if (filtered.length === 0) {
        grid.innerHTML = '<div class="no-results">No terms found matching your criteria.</div>';
        return;
    }
    
    filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'glossary-card';
        card.innerHTML = `
            <div class="term-header">
                <div class="term-title">${item.title}</div>
                <div class="term-badge">${item.cat}</div>
            </div>
            <div class="term-def">${item.def}</div>
        `;
        grid.appendChild(card);
    });
}

searchInput.addEventListener('input', (e) => {
    currentSearch = e.target.value;
    renderGlossary();
});

filterTags.forEach(tag => {
    tag.addEventListener('click', () => {
        filterTags.forEach(t => t.classList.remove('active'));
        tag.classList.add('active');
        currentFilter = tag.dataset.filter;
        renderGlossary();
    });
});

// Initial render
renderGlossary();
</script>
{% endblock %}
