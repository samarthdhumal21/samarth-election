{% extends "base.html" %}

{% block head %}
<style>
.quiz-container {
    max-width: 700px;
    margin: 0 auto;
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-shadow);
    border-radius: 8px;
    padding: 30px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.quiz-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.progress-bar-bg {
    width: 100%;
    height: 8px;
    background: rgba(0,0,0,0.05);
    border-radius: 4px;
    margin-bottom: 30px;
    overflow: hidden;
}

.progress-bar-fill {
    height: 100%;
    background-color: var(--saffron);
    width: 0%;
    transition: width 0.3s ease;
}

.question-text {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 20px;
    min-height: 60px;
}

.options-grid {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.option-btn {
    background: rgba(0,0,0,0.05);
    border: 2px solid transparent;
    color: var(--text-main);
    padding: 15px 20px;
    border-radius: 8px;
    font-size: 16px;
    text-align: left;
    cursor: pointer;
    transition: all 0.2s ease;
}

.option-btn:hover:not(:disabled) {
    background-color: rgba(0,0,0,0.1);
}

.option-btn.correct {
    background-color: var(--saffron-light);
    border-color: var(--saffron);
}

.option-btn.wrong {
    background-color: rgba(226, 33, 52, 0.2);
    border-color: #e22134;
}

.feedback-box {
    margin-top: 20px;
    padding: 15px;
    border-radius: 8px;
    display: none;
    font-size: 14px;
}

.feedback-box.correct {
    display: block;
    background-color: var(--saffron-light);
    border-left: 4px solid var(--saffron);
}

.feedback-box.wrong {
    display: block;
    background-color: rgba(226, 33, 52, 0.1);
    border-left: 4px solid #e22134;
}

.next-btn {
    margin-top: 20px;
    width: 100%;
    display: none;
}

.result-screen {
    display: none;
    text-align: center;
}

.score-circle {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    border: 8px solid var(--saffron);
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 48px;
    font-weight: 700;
    margin: 0 auto 20px;
}

.performance-label {
    font-size: 24px;
    color: var(--saffron);
    margin-bottom: 30px;
}

.skeleton {
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    0% { opacity: 0.6; }
    50% { opacity: 1; }
    100% { opacity: 0.6; }
}

.skeleton-text {
    height: 24px;
    background: rgba(0,0,0,0.05);
    border-radius: 4px;
    margin-bottom: 10px;
}

.skeleton-btn {
    height: 50px;
    background: rgba(0,0,0,0.05);
    border-radius: 8px;
}
</style>
{% endblock %}

{% block content %}
<div class="quiz-container" id="quizContainer">
    <!-- Loading Skeleton -->
    <div id="loadingSkeleton">
        <div class="skeleton skeleton-text" style="width: 30%;"></div>
        <div class="progress-bar-bg"><div class="skeleton skeleton-btn" style="height: 100%;"></div></div>
        <div class="skeleton skeleton-text" style="width: 80%; height: 60px; margin-bottom: 30px;"></div>
        <div class="options-grid">
            <div class="skeleton skeleton-btn"></div>
            <div class="skeleton skeleton-btn"></div>
            <div class="skeleton skeleton-btn"></div>
            <div class="skeleton skeleton-btn"></div>
        </div>
    </div>

    <!-- Active Quiz -->
    <div id="activeQuiz" style="display: none;">
        <div class="quiz-header">
            <span id="questionCounter">Question 1/15</span>
            <span id="scoreCounter">Score: 0</span>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressBar"></div>
        </div>
        
        <div class="question-text" id="questionText">Question goes here?</div>
        
        <div class="options-grid" id="optionsGrid">
            <!-- Buttons injected by JS -->
        </div>
        
        <div class="feedback-box" id="feedbackBox">
            <strong id="feedbackTitle">Correct!</strong>
            <p id="feedbackText">Explanation goes here.</p>
        </div>
        
        <button class="btn-primary next-btn" id="nextBtn" onclick="nextQuestion()">Next Question</button>
    </div>

    <!-- Result Screen -->
    <div id="resultScreen" class="result-screen">
        <h2>Quiz Completed!</h2>
        <p style="color: var(--text-muted); margin-bottom: 20px;">Here is your final result:</p>
        
        <div class="score-circle" id="finalScore">15/15</div>
        <div class="performance-label" id="performanceLabel">Democracy Champion</div>
        
        <div style="display: flex; gap: 15px; justify-content: center; margin-top: 30px;">
            <button class="btn-secondary" onclick="location.reload()"><i class="fa-solid fa-rotate-right"></i> Retry Quiz</button>
            <button class="btn-primary" onclick="alert('Score copied to clipboard!')"><i class="fa-solid fa-share-nodes"></i> Share Score</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const quizData = [
    {
        q: "Who conducts general elections in India?",
        options: ["Supreme Court", "Parliament", "Election Commission of India", "President of India"],
        a: 2,
        exp: "The Election Commission of India (ECI) is an autonomous constitutional authority responsible for administering election processes in India."
    },
    {
        q: "What is the minimum age to vote in India?",
        options: ["16 years", "18 years", "21 years", "25 years"],
        a: 1,
        exp: "The voting age was reduced from 21 to 18 years by the 61st Amendment Act of 1988."
    },
    {
        q: "What does EVM stand for?",
        options: ["Electronic Voting Machine", "Election Validation Mechanism", "Electoral Vote Monitor", "Electronic Voter Matrix"],
        a: 0,
        exp: "EVMs have been used in all general and state assembly elections of India since 2004."
    },
    {
        q: "What is NOTA?",
        options: ["National Organization of Trade Associations", "None of the Above", "New Order of Tax Administration", "Notice of Transfer Action"],
        a: 1,
        exp: "NOTA allows voters to indicate disapproval of all candidates in a voting system."
    },
    {
        q: "How many Lok Sabha constituencies are there?",
        options: ["500", "543", "550", "552"],
        a: 1,
        exp: "There are currently 543 elected constituencies. The 2 nominated Anglo-Indian seats were abolished in 2020."
    },
    {
        q: "What does VVPAT stand for?",
        options: ["Voter Verified Paper Audit Trail", "Voting Verification Print and Tally", "Voter Validation Process and Tracking", "Visual Verification of Political Action Trail"],
        a: 0,
        exp: "VVPAT provides feedback to voters using a ballotless voting system to verify their vote."
    },
    {
        q: "Which article of the Indian Constitution establishes the Election Commission?",
        options: ["Article 370", "Article 324", "Article 356", "Article 14"],
        a: 1,
        exp: "Article 324 vests the superintendence, direction and control of elections in an Election Commission."
    },
    {
        q: "What is the Model Code of Conduct (MCC)?",
        options: ["A law passed by Parliament", "Guidelines by ECI for political parties", "Rules for voters on polling day", "The oath taken by the President"],
        a: 1,
        exp: "MCC is a set of guidelines issued by the ECI to regulate political parties and candidates prior to elections."
    },
    {
        q: "What is the term length for a member of the Lok Sabha?",
        options: ["4 years", "5 years", "6 years", "Life term"],
        a: 1,
        exp: "Unless dissolved sooner, the Lok Sabha continues for five years from the date appointed for its first meeting."
    },
    {
        q: "Who appoints the Chief Election Commissioner of India?",
        options: ["Prime Minister", "Chief Justice of India", "President of India", "Parliament"],
        a: 2,
        exp: "The President of India appoints the Chief Election Commissioner and other Election Commissioners."
    },
    {
        q: "What is a 'By-election'?",
        options: ["Election held before term ends", "Election for local bodies only", "Election to fill a vacancy", "Election involving only two parties"],
        a: 2,
        exp: "A by-election is held to fill a political office that has become vacant between regularly scheduled elections."
    },
    {
        q: "Indelible ink used in Indian elections contains which chemical?",
        options: ["Silver Nitrate", "Copper Sulphate", "Potassium Permanganate", "Sodium Chloride"],
        a: 0,
        exp: "Silver nitrate is used because it stains the skin and cannot be washed off easily, preventing double voting."
    },
    {
        q: "What is the deposit amount for a Lok Sabha candidate?",
        options: ["₹10,000", "₹25,000", "₹50,000", "₹1,00,000"],
        a: 1,
        exp: "A general candidate contesting Lok Sabha elections must deposit ₹25,000 (SC/ST candidates deposit ₹12,500)."
    },
    {
        q: "Which app allows citizens to report MCC violations?",
        options: ["Voter Helpline", "cVIGIL", "Garuda", "Suvidha"],
        a: 1,
        exp: "cVIGIL app allows citizens to report violations of the Model Code of Conduct directly to the ECI."
    },
    {
        q: "Who acts as the Returning Officer for a Parliamentary constituency?",
        options: ["District Magistrate", "Chief Minister", "Police Commissioner", "High Court Judge"],
        a: 0,
        exp: "Usually, the District Magistrate (DM) or Collector acts as the Returning Officer for a Lok Sabha constituency."
    }
];

let currentQuestion = 0;
let score = 0;
let answered = false;

// Simulate loading
setTimeout(() => {
    document.getElementById('loadingSkeleton').style.display = 'none';
    document.getElementById('activeQuiz').style.display = 'block';
    loadQuestion();
}, 1000);

function loadQuestion() {
    const q = quizData[currentQuestion];
    document.getElementById('questionText').innerText = q.q;
    document.getElementById('questionCounter').innerText = `Question ${currentQuestion + 1}/${quizData.length}`;
    document.getElementById('progressBar').style.width = `${((currentQuestion) / quizData.length) * 100}%`;
    
    const grid = document.getElementById('optionsGrid');
    grid.innerHTML = '';
    
    q.options.forEach((opt, index) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        btn.onclick = () => selectOption(index, btn);
        grid.appendChild(btn);
    });
    
    document.getElementById('feedbackBox').className = 'feedback-box';
    document.getElementById('nextBtn').style.display = 'none';
    answered = false;
}

function selectOption(index, btn) {
    if (answered) return;
    answered = true;
    
    const q = quizData[currentQuestion];
    const buttons = document.querySelectorAll('.option-btn');
    
    // Disable all
    buttons.forEach(b => b.disabled = true);
    
    const feedbackBox = document.getElementById('feedbackBox');
    const feedbackTitle = document.getElementById('feedbackTitle');
    const feedbackText = document.getElementById('feedbackText');
    
    if (index === q.a) {
        btn.classList.add('correct');
        score++;
        document.getElementById('scoreCounter').innerText = `Score: ${score}`;
        feedbackBox.className = 'feedback-box correct';
        feedbackTitle.innerText = 'Correct!';
    } else {
        btn.classList.add('wrong');
        buttons[q.a].classList.add('correct');
        feedbackBox.className = 'feedback-box wrong';
        feedbackTitle.innerText = 'Incorrect';
    }
    
    feedbackText.innerText = q.exp;
    document.getElementById('nextBtn').style.display = 'block';
    
    // update progress
    document.getElementById('progressBar').style.width = `${((currentQuestion + 1) / quizData.length) * 100}%`;
}

function nextQuestion() {
    currentQuestion++;
    if (currentQuestion < quizData.length) {
        loadQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById('activeQuiz').style.display = 'none';
    document.getElementById('resultScreen').style.display = 'block';
    
    document.getElementById('finalScore').innerText = `${score}/15`;
    
    let label = 'Novice';
    if (score >= 12) label = 'Democracy Champion';
    else if (score >= 7) label = 'Informed Voter';
    
    document.getElementById('performanceLabel').innerText = label;
}
</script>
{% endblock %}
